# nginx in front of `keel serve`. TLS, the HTTP redirect, the security headers and
# the access log.
#
# PREPARED, NOT APPLIED, AND IT IS NOT LOADED FROM THIS PATH. Everything under
# scripts/deploy/ is Claude's to write and Al's to apply, the same split
# .github/workflows/deploy.yml and scripts/s3-archive/ are built on. nginx reads
# /etc/nginx/sites-enabled/, not a file in a git checkout, so installing this is a
# copy and a symlink that Al makes. RUNBOOK.md section 3.8 has the commands.
#
# IT REPLACES THE Caddyfile, REMOVED 11 SEPTEMBER 2026. The box already ran nginx
# for another application, and two processes cannot both hold 80 and 443. The
# reasoning in the Caddyfile is not withdrawn; it is carried over here, which is why
# the comments below are long in the same places.
#
# THE UPSTREAM IS A LOOPBACK PORT AND NOT A CONTAINER NAME. Caddy was inside the
# compose project and proxied to `keel-serve:3000` over a Docker network. nginx is
# on the host and has no route into that network, so docker-compose.prod.yml now
# publishes the API on 127.0.0.1. If KEEL_BIND_ADDR in .env is not the default, the
# proxy_pass line below is the other half of that change and both move together.

# ---------------------------------------------------------------------------
# ONE HOSTNAME, AND THE APEX IS DELIBERATELY NOT IT.
#
# This box serves api.keels.app and nothing else of Keel's. The landing page and
# the dashboard at keels.app and www.keels.app are a different application, in a
# different repository, already deployed on VERCEL. Their DNS points at Vercel.
#
# WITH CADDY THIS WAS A STARTUP FAILURE. Caddy requested a certificate for every
# hostname in its config the moment it loaded, so naming the apex here took the API
# down until the retries backed off. NGINX IS QUIETER AND THAT IS WORSE, not better:
# it will happily accept a `server_name keels.app` block and serve it, and the
# breakage moves to certbot, which cannot solve a challenge for a name whose DNS
# answers with Vercel's address. The failure is then a renewal that silently stops
# working weeks later rather than a site that will not start now.
#
# So there is no apex block, no www block and no catch-all. If the apex should ever
# point here, that is a DNS change away from Vercel first and a change to this file
# second, in that order, and it is Al's call rather than an edit.
# ---------------------------------------------------------------------------

# Port 80 exists for two things and serves no content of its own: the ACME HTTP-01
# challenge, and the redirect. Section 3.2 of the runbook is why 80 stays open on a
# host that answers only HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name api.keels.app;

    # THE CHALLENGE LOCATION COMES FIRST AND IS NOT REDIRECTED. A blanket 301 on
    # this server block would bounce the CA to HTTPS, and a renewal against a
    # certificate that has already expired cannot complete a TLS handshake. That is
    # the failure mode where a site works for ninety days and then does not.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # THE OLD `http2` LISTEN PARAMETER, ON PURPOSE, AND IT IS THE COMPATIBLE ONE
    # RATHER THAN THE CURRENT ONE. nginx 1.25.1 introduced a separate `http2 on;`
    # directive and deprecated this form, but deprecated still works and prints a
    # warning, whereas `http2 on;` on anything older is `unknown directive` and
    # `nginx -t` fails outright. Ubuntu 22.04 ships nginx 1.18 and 24.04 ships
    # 1.24, so the modern form fails on both. Check with `nginx -v` and switch to
    # the two-line form only on 1.25.1 or newer.
    #
    # MEASURED RATHER THAN ASSUMED, 11 September 2026, with this file mounted into
    # a container and `nginx -t` run against it, a self-signed certificate in place
    # of Let's Encrypt's: nginx 1.24 accepts it silently, and nginx 1.31.5 accepts
    # it with `[warn] the "listen ... http2" directive is deprecated`. A warning on
    # new nginx is the cheaper of the two failures.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.keels.app;

    # CERTBOT'S PATHS, and this file assumes certbot pointed at /var/www/html with
    # the webroot plugin, matching the challenge location above. If the box uses a
    # different ACME client these two lines are what changes and nothing else here
    # does.
    ssl_certificate     /etc/letsencrypt/live/api.keels.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.keels.app/privkey.pem;

    # THE TLS SETTINGS ARE WRITTEN OUT RATHER THAN INCLUDED, AND THAT IS THE POINT.
    # The usual pair of lines here is:
    #
    #   include /etc/letsencrypt/options-ssl-nginx.conf;
    #   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    #
    # Both files are written by certbot's NGINX INSTALLER plugin. Run
    # `certbot certonly --webroot`, which is the form section 3.8 recommends,
    # and neither file exists, so `nginx -t` fails on a missing include and the
    # error names a certbot path rather than the choice that caused it.
    #
    # ssl_dhparam is omitted entirely rather than generated: it applies only to
    # the DHE ciphers, and the suite below is ECDHE only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:KeelSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # `-Server` in the Caddyfile removed the header outright. nginx cannot do that
    # without a third-party module; server_tokens off is the whole of what is
    # available and it drops the version while keeping the word "nginx". That is a
    # line of noise in a response somebody reads by hand, not a security measure,
    # and it was not one in Caddy either.
    server_tokens off;

    access_log /var/log/nginx/keel-access.log;
    error_log  /var/log/nginx/keel-error.log;

    # The access log is rotated by the host's logrotate, which is where nginx logs
    # are already rotated for the other application on this box. Caddy rolled its
    # own on a 50 MiB budget, and that budget existed because an access log filling
    # the disk takes Postgres down with it. Check that Keel's two files are covered
    # by /etc/logrotate.d/nginx, because a file nginx writes and logrotate does not
    # know about grows without limit.

    # gzip only. Caddy had `encode zstd gzip`; stock nginx has no zstd without a
    # module, and the responses here are JSON measured in kilobytes.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # -----------------------------------------------------------------------
    # NOTHING HERE ADDS A CORS HEADER, AND THAT IS A RULE RATHER THAN AN OMISSION.
    #
    # CORS is handled inside internal/api. That package holds the allowlist, reads
    # it from KEEL_CORS_ORIGINS, echoes the request origin back only on an exact
    # match, answers preflight with 204, and sends Vary: Origin on every response
    # including the ones it refuses.
    #
    # TWO SOURCES OF CORS HEADERS IS WORSE THAN A DUPLICATED SETTING. An
    # `add_header Access-Control-Allow-Origin` here would send the header twice,
    # and two of them is not a lenient case a browser picks from: it is a hard CORS
    # failure, so the dashboard would break in exactly the situation both layers
    # were trying to serve. It would also split the allowlist across a Go file and
    # this one, so narrowing it later would mean finding both.
    #
    # Same for anything that answers OPTIONS here. The API answers preflight itself
    # with a 204 and the preflight has to reach it.
    # -----------------------------------------------------------------------

    # HSTS FOR THIS HOSTNAME ONLY. No includeSubdomains and no preload, which is
    # the whole point: both reach past api.keels.app and bind keels.app,
    # www.keels.app and every future subdomain to HTTPS. Those are served by Vercel
    # and are not this box's to make promises for. Preload is worse again, because
    # it is a submission to a list that is slow to leave.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # The API serves JSON and never HTML, so there is no document for a frame to
    # hold and nothing for a script to load.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        # THE PORT HERE AND KEEL_BIND_ADDR IN .env ARE ONE SETTING IN TWO FILES.
        # docker-compose.prod.yml defaults to 127.0.0.1:3000 and this matches it.
        # Change one without the other and nginx answers 502 with "connect() failed
        # (111: Connection refused)" in the error log, which names the port.
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 65 SECONDS, JUST PAST THE API'S OWN 60 SECOND WriteTimeout in
        # internal/api's Serve. A proxy that gives up first turns the server's own
        # timeout into a 504 from nginx and loses the reason. This is the
        # proxy_read_timeout because that is the one that measures the wait for the
        # upstream's response; the connect timeout below is the one that matters
        # when the container is down rather than slow.
        proxy_read_timeout 65s;
        proxy_connect_timeout 5s;

        # ADD NO HEADER INSIDE THIS BLOCK. An `add_header` in a location replaces
        # every inherited one rather than adding to them, so a single directive
        # here would silently drop the four security headers above. If one is ever
        # needed in here, all five have to be repeated.
    }
}
