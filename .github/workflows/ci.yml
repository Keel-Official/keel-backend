name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.23"

jobs:
  build:
    name: build, vet, arch, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      # Uses -e because internal/conformance/golden_test.go (behind the
      # conformance build tag) imports internal/depth, which does not exist yet,
      # and tidy without -e fails hard on that.
      #
      # CONDITION FOR REMOVING -e: once internal/depth has a body, go back to a
      # plain `go mod tidy` so that dangling dependencies are caught again.
      - name: go mod tidy changes nothing
        run: |
          go mod tidy -e
          git diff --exit-code go.mod go.sum

      - run: go build ./...

      - run: go vet ./...

      # Purity of internal/domain and internal/depth. Split into its own step so
      # that a failure reads clearly in the step list instead of drowning among
      # the other tests.
      - name: arch (purity of the domain and depth packages)
        run: go test ./internal/domain/ -run TestArch -count=1 -v

      - run: go test ./... -race -count=1

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Action v6 installs the v1 golangci-lint binary (1.64.8) REGARDLESS of
      # `version: latest`, and a v1 binary rejects a .golangci.yml written for v2
      # with "additional properties 'version', 'formatters' not allowed". Proven
      # on this repository's first CI run, 20 August 2026. Action v9 is the v2 era
      # action. See docs/internal/audit-2026-08-20.md section 7.
      #
      # The binary version is PINNED, not `latest`. A linter that bumps itself
      # turns CI red without a single line of code changing, which drains the
      # meaning out of a CI failure.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0

  conformance:
    name: conformance (methodology not implemented yet)
    runs-on: ubuntu-latest
    # DELIBERATELY allowed to fail. The USTRY golden fixture is a specification
    # waiting to be met, and internal/depth is still empty, so this job stays red
    # until the methodology is written. That is an honest state.
    #
    # CONDITION FOR REMOVAL: once internal/depth passes the fixture, delete the
    # continue-on-error line, delete the build tag in golden_test.go, and fold
    # this job into the build job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -tags conformance ./internal/conformance/ -count=1 -v
