name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.23"

jobs:
  build:
    name: build, vet, arch, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      # This step carried -e until 23 August 2026, because
      # internal/conformance/golden_test.go imported internal/depth, a package
      # with no .go file in it, and tidy without -e fails hard on an import it
      # cannot resolve. The condition written here for removing it named the wrong
      # event: it said "once internal/depth has a body", when what actually
      # mattered was only that the import resolves. Methodology 1.0.3 moved those
      # functions into internal/domain, so the import resolved from that moment on
      # and -e was suppressing nothing but the check itself. Plain tidy again, so a
      # dangling dependency is caught.
      - name: go mod tidy changes nothing
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go build ./...

      - run: go vet ./...

      # Purity of internal/domain. Split into its own step so that a failure reads
      # clearly in the step list instead of drowning among the other tests.
      - name: arch (purity of the domain package)
        run: go test ./internal/domain/ -run TestArch -count=1 -v

      - run: go test ./... -race -count=1

  # Layer 1 of the validation protocol, acceptance criterion 4. It asks whether the
  # five hand recomputations exist under testdata/manual/ and whether each one names
  # an asset and a ledger sequence. Needs no Go, so it checks out and runs.
  #
  # IT IS EXPECTED RED AND IT CARRIES continue-on-error: true. That flag is not a
  # way to hide a failure. It is here because Layer 1 is a SPECIFICATION WAITING TO
  # BE MET, exactly as the golden fixture was when the conformance job sat in this
  # file with the same flag and the same reason. 0 of 5 recomputations exist and the
  # directory that holds them is red, so nothing on Claude's side of the wall can
  # turn this green; only Al working the five books by hand can.
  #
  # THE LESSON FROM THE JOB THIS COPIES. That conformance job was, in the words of
  # the comment that replaced it, "a job nobody was expected to read", and it was
  # only folded into `build` once its removal condition was actually met. So this
  # one does not stand alone as the record of the absence: P2-23 in
  # scripts/audit-verification.sh reports it as a standing finding, which is the
  # place this repository goes to read what is still owed.
  #
  # REMOVAL CONDITION, stated so the flag has an end rather than a habit: when the
  # script exits 0, delete continue-on-error and move this into the `build` job, and
  # promote `manual-check` into the `ci` target in the Makefile at the same time.
  # Deleting the flag before then turns main red without a line of code changing,
  # which drains the meaning out of a CI failure the same way an unpinned linter
  # does.
  manual-recomputation:
    name: layer 1 hand recomputation (expected red until 5 of 5 land)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: five hand recomputations exist, each naming an asset and a ledger
        run: bash scripts/check-manual-recomputation.sh

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Action v6 installs the v1 golangci-lint binary (1.64.8) REGARDLESS of
      # `version: latest`, and a v1 binary rejects a .golangci.yml written for v2
      # with "additional properties 'version', 'formatters' not allowed". Proven
      # on this repository's first CI run, 20 August 2026. Action v9 is the v2 era
      # action. See docs/internal/audit-2026-08-20.md section 7.
      #
      # The binary version is PINNED, not `latest`. A linter that bumps itself
      # turns CI red without a single line of code changing, which drains the
      # meaning out of a CI failure.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0

  # THE CONFORMANCE JOB WAS FOLDED INTO `build` ON 26 AUGUST 2026, which is what
  # its own removal condition said to do once compute.go passed the fixture.
  #
  # It existed with continue-on-error: true, deliberately allowed to fail, because
  # the golden fixture was a specification waiting to be met and every function in
  # internal/domain/compute.go panicked. That was an honest state and it is over.
  # internal/conformance no longer carries a build tag, so `go test ./... -race` in
  # the build job above runs it and a failure there is now a red build rather than
  # a job nobody was expected to read.
