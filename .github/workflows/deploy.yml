name: deploy

# WHAT THIS WORKFLOW IS AND WHERE IT STOPS.
#
# AMENDED 11 SEPTEMBER 2026, AND THE ORIGINAL TEXT IS KEPT RATHER THAN REPLACED,
# because the reasoning did not change when the deploy job arrived. It read:
#
#   "It builds the image, proves the image actually serves, and publishes it to
#   this repository's own container registry. It does NOT put it on a host. That
#   split is deliberate and is the same one scripts/s3-archive/ is built on: an
#   agent that provisions the infrastructure its own evidence lives in has no
#   chain of custody, it has a filing cabinet. The hosting account, its secrets
#   and the production database are Al's, and the deploy job below refuses to
#   invent them."
#
# ONE CLAUSE OF THAT IS NOW FALSE AND THE REST IS NOT. It does put the image on a
# host, because a host now exists. What has not changed is the split the sentence
# was written to protect: this workflow PROVISIONS nothing. It does not create the
# box, the DNS record, the database or the certificate; it connects to a box Al
# built, with a key Al generated, at an address Al set, and it holds no credential
# of its own. Every one of those is a repository variable or secret, and with any
# of them missing the deploy job still refuses rather than guesses. The filing
# cabinet sentence is why the job is gated on KEEL_DEPLOY_TARGET instead of having
# a default, and it stays.
#
# IT NEVER RUNS ON A PUSH TO main. A deployment workflow that fires on every commit
# and fails for want of a secret teaches people to ignore a red tick, and a red
# tick nobody reads is worse than no check.
#
# THE TWO JOBS DO NOT SHARE A TRIGGER, AND THAT IS DELIBERATE RATHER THAN AN
# OVERSIGHT. The sentence here used to end "It runs when a version tag is pushed,
# or when somebody presses the button", and that is still true of the IMAGE job.
# The DEPLOY job runs on a version tag ONLY: it carries `if: github.ref_type ==
# 'tag'`. So a workflow_dispatch builds, smoke tests and publishes, and deploys
# nothing. Publishing an image is cheap and reversible; putting one in front of the
# public API is a decision, and a decision gets a tag that says which release it
# was. Pressing a button leaves no such record.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # No GO_VERSION here on purpose. Nothing in this workflow runs Go: the compiler
  # runs inside the image build, pinned by the FROM line in the Dockerfile, and
  # the smoke test reads the methodology version out of the source file rather
  # than out of a toolchain. A version declared and unused is a version somebody
  # will later believe is being honoured.
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------ image
  #
  # Build, then SMOKE TEST, then push. In that order, so a broken image is never
  # published: an image that cannot start is discovered here rather than by
  # whoever pulls it.
  image:
    name: build, smoke test, publish
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel_dev_only
          POSTGRES_DB: keel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # QEMU IS WHAT MAKES THE arm64 HALF OF THE PUBLISH STEP POSSIBLE. This
      # runner is amd64, and building a linux/arm64 image on it means executing
      # the arm64 build stage under emulation, which needs binfmt_misc handlers
      # registered. They are not registered on a GitHub-hosted runner by
      # default, so without this step the arm64 build fails inside the golang
      # stage rather than at the buildx invocation, which is a confusing place
      # to read the error.
      #
      # IT MAKES A TAG BUILD SLOWER, AND THE COST WAS MEASURED RATHER THAN
      # ASSUMED, because the folklore here is wrong by a wide margin. Building
      # this repository's image with `--no-cache`, one platform at a time, on an
      # arm64 laptop on 11 September 2026: 14 seconds native, 30 seconds
      # emulated. So emulation costs about 2x on this workload, not the order of
      # magnitude usually quoted for Go under QEMU. A tag build gains roughly the
      # length of one build, not minutes.
      #
      # THAT MEASUREMENT IS WHY THE DOCKERFILE WAS LEFT ALONE. The durable fix is
      # to stop emulating and cross-compile, which Go does natively: `FROM
      # --platform=$BUILDPLATFORM` on the build stage plus `GOARCH=$TARGETARCH`
      # on the build command, which keeps the compiler running on the runner's
      # own architecture. It is three lines and it is the right shape. At 2x on a
      # build this size it is not yet worth spending a change to the image's
      # definition on, and the number above is what to re-check before deciding
      # otherwise. The ratio was taken with the arm64 half native and the amd64
      # half emulated; on a GitHub runner those swap, and the ratio is what
      # carries over rather than the seconds.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # ONE COMPUTED DATE RATHER THAN AN EVENT FIELD.
      # github.event.repository.updated_at is empty on workflow_dispatch, and a
      # label that is present on a tag build and blank on a manual one is worse
      # than one that is always the same shape.
      - name: Stamp
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # SINGLE PLATFORM HERE, DELIBERATELY, AND THE PUBLISH STEP BELOW IS THE
      # MULTI-PLATFORM ONE.
      #
      # THE REASON IS WHAT THIS STEP IS FOR. It loads the image into the local
      # daemon so the next steps can RUN it: `docker run keel:smoke serve` and
      # then a real HTTP request against it. This runner is amd64, so an arm64
      # image loaded here could not be executed, and building one under QEMU
      # emulation purely to not run it would double the slowest part of the job
      # for nothing.
      #
      # `load: true` also cannot hold more than one platform on this runner. A
      # manifest list needs an image store that can represent one, and a
      # GitHub-hosted runner has the classic docker store rather than the
      # containerd one, so the export fails there. That is store-dependent and
      # not a universal law, which is why the paragraph above is the reason to
      # rely on and this one is only the mechanism.
      #
      # WHAT THIS COSTS, STATED PLAINLY: the arm64 image is published without
      # ever having been started. The smoke test proves that THIS COMMIT serves
      # and reports the right methodology version, on amd64. It does not prove
      # the arm64 binary starts. Nothing in a cross-built Go binary makes that
      # likely to differ, and the deploy job's version check against the live
      # API is what would catch it on an arm64 host, one step later than here.
      - name: Build the image, load it locally, do not push yet
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: keel:smoke
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # THE SCHEMA COMES FROM scripts/migrate.sh AND NOT FROM A COPY OF IT HERE.
      # That script's header states the rule: a migration applied from two places
      # is a migration nobody can say ran. It gained a DSN transport on
      # 5 September 2026 precisely so this step could reuse it rather than
      # reimplement the ordering and the bookkeeping in YAML.
      #
      # The database this points at is a service container that lives for the
      # length of this job. It is a fixture, not an environment.
      - name: Apply the schema to the smoke database
        env:
          KEEL_MIGRATE_DSN: "postgres://keel:keel_dev_only@localhost:5432/keel?sslmode=disable"
        run: bash scripts/migrate.sh

      # `keel serve` refuses to start when schema_migrations is empty, which is
      # why the step above is not optional. --network host lets the container
      # reach the service container on localhost without a compose network.
      - name: Start the container
        run: |
          docker run -d --name keel-smoke --network host \
            -e KEEL_DSN="postgres://keel:keel_dev_only@localhost:5432/keel?sslmode=disable" \
            keel:smoke serve -addr :3000

      # THE ASSERTION IS ON THE BODY AND NOT ONLY ON THE STATUS CODE. A 200 with
      # the wrong methodology version is the failure DEC-014 section 5 records:
      # the contract once advertised a version the server did not return, and the
      # generated mock served it. So this checks that the running image reports
      # the version the source in this same commit compiles.
      - name: GET /v1/health, and check what it says
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/v1/health >/tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          # READ FROM THE SOURCE, NOT FROM A TOOLCHAIN. `go run` would need Go on
          # the runner at a version this job never pinned, and the thing being
          # compared is a constant in a file that is right here.
          want=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+-draft"' internal/domain/types.go | head -1 | tr -d '"')
          test -n "$want" || { echo "could not read MethodologyVersion from internal/domain/types.go" >&2; exit 1; }
          got=$(python3 -c 'import json,sys; print(json.load(open("/tmp/health.json"))["methodologyVersion"])')
          echo "image reports $got, this commit compiles $want"
          test "$got" = "$want"

      # A degraded status is EXPECTED here and is not a failure. The health
      # handler reports degraded when no scan has ever run, and nothing has
      # scanned this throwaway database. Asserting "ok" would mean seeding a scan
      # to satisfy a check, which is the shape of tuning a test until it passes.
      - name: Report the health status without asserting on it
        run: |
          python3 -c 'import json; d=json.load(open("/tmp/health.json")); print("status:", d["status"], "assets:", d["assetsMonitored"])'

      - name: Container logs, always
        if: always()
        run: docker logs keel-smoke || true

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TWO ARCHITECTURES, ONE TAG. The registry gets a manifest list, so
      # `docker pull` on either kind of box resolves to the right image with no
      # tag suffix to remember and no second name to keep in step.
      #
      # WHY arm64 IS HERE AT ALL: most of the cheap single instances now are
      # arm64, and an amd64-only image turns "which box" into a decision that
      # has to be made before the first deploy and cannot be revisited without a
      # rebuild. The failure it prevents is `exec format error` at `up -d`, which
      # says nothing about architecture to somebody who has not met it before.
      - name: Tag and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}
          cache-from: type=gha

      - name: Say what was published
        run: |
          {
            echo "### Image published"
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}"
            echo '```'
            echo ""
            echo "Two platforms: linux/amd64 and linux/arm64, in one manifest list."
            echo ""
            echo "The amd64 image passed a smoke test: schema applied with scripts/migrate.sh, container started, GET /v1/health returned the same methodology version this commit compiles. The arm64 image was cross-built and published without being started; see the comment on the smoke build step."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ deploy
  #
  # THIS JOB IS SKIPPED UNTIL AL CONFIGURES A TARGET, AND THAT IS THE HONEST STATE
  # RATHER THAN A PLACEHOLDER. Setting the repository variable KEEL_DEPLOY_TARGET
  # is what turns it on, and until then it reports what it is waiting for instead
  # of pretending to have deployed. A job that "succeeded" without deploying would
  # be a green tick that means nothing, which is the failure the trigger rules are
  # also written against.
  #
  # WHAT IT ASSERTS, AND IT IS ONE THING. That the API answering at the public URL
  # reports the same methodologyVersion as the constant THIS commit compiles. That
  # is the entire point of the job. DEC-014 section 5 is why: the contract once
  # advertised a version the server did not return, and the generated mock served
  # it, so "the deploy finished" and "the deploy put this code live" are different
  # claims and only the second one is worth making.
  #
  # WHAT IT DOES NOT ASSERT: the status field. `degraded` is correct for up to
  # fifteen minutes after a deploy, because the health handler reports it until a
  # scan has been recorded and `keel scan` runs on a fifteen minute interval.
  # Asserting `ok` would mean either waiting a quarter of an hour in CI or seeding
  # a scan to satisfy a check, and the second is the shape of tuning a test until
  # it passes.
  #
  # PLAIN ssh AND NO THIRD-PARTY ACTION. A marketplace action in this job would
  # see the private key and the host, so trusting one is trusting whoever can push
  # a tag to it. `ssh` is already on the runner and the whole invocation is nine
  # lines below.
  #
  # NO STELLAR CREDENTIAL EXISTS ANYWHERE IN HERE. Keel is permanently read only:
  # it never signs and never submits a transaction, and there is no signing code in
  # the repository. The two secrets are an SSH key for a box and a host key to pin
  # it, and neither can authorise anything on the network.
  deploy:
    name: deploy
    needs: image
    runs-on: ubuntu-latest
    # VERSION TAGS ONLY. See the header: a workflow_dispatch publishes an image and
    # deploys nothing.
    if: github.ref_type == 'tag'
    steps:
      - name: What this is waiting for
        if: vars.KEEL_DEPLOY_TARGET == ''
        run: |
          {
            echo "### Not deployed"
            echo ""
            echo "The image is built and published. Nothing is deployed, because no target is configured."
            echo ""
            echo "Everything below is prepared and unapplied. The steps are"
            echo "\`scripts/deploy/RUNBOOK.md\`, and all of this is Al's:"
            echo ""
            echo "1. A host and the DNS record for it. Runbook sections 3.1 to 3.3."
            echo "   The image is published for amd64 AND arm64, so either is fine."
            echo "2. The \`.env\` file on that host, including the database password."
            echo "   Runbook section 3.4."
            echo "3. The schema applied to it once, by hand:"
            echo "   \`COMPOSE_FILE=docker-compose.prod.yml bash scripts/migrate.sh\`."
            echo "   Runbook section 3.5. This job never migrates."
            echo "4. The demonstration set declared once. Runbook section 3.6."
            echo "5. These five settings, which are what turn this job on. Runbook section 10:"
            echo ""
            echo "   | setting | kind | value |"
            echo "   | --- | --- | --- |"
            echo "   | \`KEEL_DEPLOY_TARGET\` | variable | user@host, the SSH destination |"
            echo "   | \`KEEL_HEALTH_URL\` | variable | the health endpoint to check after deploying |"
            echo "   | \`KEEL_DEPLOY_PATH\` | variable | optional, defaults to /opt/keel |"
            echo "   | \`KEEL_DEPLOY_SSH_KEY\` | secret | private key for that host |"
            echo "   | \`KEEL_DEPLOY_KNOWN_HOSTS\` | secret | \`ssh-keyscan\` of that host |"
            echo ""
            echo "Same PREPARE and APPLY split as scripts/s3-archive/: the runbook and the"
            echo "tooling are written here, the account and the secrets are not."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "no deploy target configured; nothing was deployed"

      # EVERY REMAINING STEP CARRIES THE SAME CONDITION. A job-level `if` would
      # skip the step above too, and the summary it writes is the whole value of
      # this job while no target is configured.

      # THE PARTIAL CONFIGURATION FAILS BEFORE ANYTHING IS TOUCHED. A target with
      # no health URL would deploy and then have nothing to check itself against,
      # which is the shape of a green tick that means nothing.
      - name: Refuse a half-configured target
        if: vars.KEEL_DEPLOY_TARGET != '' && vars.KEEL_HEALTH_URL == ''
        run: |
          echo "KEEL_DEPLOY_TARGET is set and KEEL_HEALTH_URL is not." >&2
          echo "" >&2
          echo "The version check after the deploy calls that URL from this runner, over the" >&2
          echo "public internet, which is the only path that proves DNS, the certificate, the" >&2
          echo "proxy and the API together. It is the entire point of this job." >&2
          echo "" >&2
          echo "There is deliberately no default and no URL written into this workflow:" >&2
          echo "guessing the public address of somebody else's host is how a deploy reports" >&2
          echo "success against a URL nobody configured." >&2
          echo "" >&2
          echo "Set the repository variable KEEL_HEALTH_URL. The documented value is in" >&2
          echo "scripts/deploy/RUNBOOK.md section 10." >&2
          exit 1

      # The checkout is for READING, not for shipping. The version assertion below
      # compares what the live API serves against the constant in this commit's
      # source; the host gets the code by fetching the same commit itself.
      - uses: actions/checkout@v4
        if: vars.KEEL_DEPLOY_TARGET != ''

      # THE HOST KEY IS PINNED AND NOT ACCEPTED. StrictHostKeyChecking=no on a
      # deploy key is the difference between "SSH to my box" and "SSH to whatever
      # answers that address today", and this job holds a key that can restart the
      # deliverable's API. KEEL_DEPLOY_KNOWN_HOSTS is `ssh-keyscan` run once, from
      # somewhere trusted.
      - name: SSH, with the host key pinned
        if: vars.KEEL_DEPLOY_TARGET != ''
        env:
          KEY: ${{ secrets.KEEL_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KEEL_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "KEEL_DEPLOY_TARGET is set but the SSH secrets are not." >&2
            echo "Both KEEL_DEPLOY_SSH_KEY and KEEL_DEPLOY_KNOWN_HOSTS are needed." >&2
            echo "See scripts/deploy/RUNBOOK.md section 10." >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # PIN THE TAG, PULL, UP. In that order, and the order is the point: .env is
      # the record of what is live, so the tag is written there BEFORE compose
      # reads it. A tag passed only on the command line would leave the file
      # saying one thing while another ran, and the next person to type
      # `docker compose up -d` by hand would silently change the running version.
      #
      # The checkout on the host is a detached checkout of THIS commit, not a pull
      # of a branch, so the compose file and the Caddyfile that come up are the
      # ones this release was reviewed with.
      #
      # These are the same four commands section 5 of the runbook gives for a
      # manual deploy. If one changes, both change.
      - name: Deploy
        if: vars.KEEL_DEPLOY_TARGET != ''
        env:
          TARGET: ${{ vars.KEEL_DEPLOY_TARGET }}
          DEPLOY_PATH: ${{ vars.KEEL_DEPLOY_PATH || '/opt/keel' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The remote script goes over stdin to `bash -s` and the values reach it
          # as environment rather than as text spliced into it. `set -o pipefail`
          # is not POSIX, so a script handed to whatever login shell the host uses
          # can fail on dash before it does anything; naming bash makes the remote
          # shell this job's choice. A quoted heredoc is expanded once, remotely,
          # so nothing here survives two rounds of quoting.
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$TARGET" \
            "DEPLOY_PATH='$DEPLOY_PATH' SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          test -f .env || {
            echo "no .env in $DEPLOY_PATH: this is first-time setup and not this job's" >&2
            echo "work. See scripts/deploy/RUNBOOK.md section 3.4." >&2
            exit 1
          }

          git fetch --depth 1 origin "$SHA"
          git checkout --detach "$SHA"

          previous=$(grep '^KEEL_IMAGE_TAG=' .env | head -1 | cut -d= -f2- || echo "(none)")
          # A temporary file and a move, so an interrupted write cannot leave a
          # .env with no image tag in it, which is a file compose refuses outright.
          sed "s|^KEEL_IMAGE_TAG=.*|KEEL_IMAGE_TAG=${SHA}|" .env > .env.next
          chmod 600 .env.next
          mv .env.next .env
          echo "image tag: was ${previous}, now ${SHA}"

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps
          REMOTE

      # WAIT ON THE STACK'S OWN HEALTH BEFORE ASKING THE INTERNET. The caddy
      # service carries the healthcheck, because the API's image is distroless and
      # has no HTTP client in it; it probes http://keel-serve:3000/v1/health and
      # asserts 200 only. Waiting here means the curl below fails for a real
      # reason rather than for arriving early.
      - name: Wait for the stack to report healthy
        if: vars.KEEL_DEPLOY_TARGET != ''
        env:
          TARGET: ${{ vars.KEEL_DEPLOY_TARGET }}
          DEPLOY_PATH: ${{ vars.KEEL_DEPLOY_PATH || '/opt/keel' }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes "$TARGET" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' keel-prod-caddy 2>/dev/null || echo unknown)
            echo "caddy health: $state"
            [ "$state" = "healthy" ] && exit 0
            sleep 5
          done
          echo "the caddy healthcheck did not reach healthy in about two and a half minutes" >&2
          docker compose -f docker-compose.prod.yml ps >&2
          docker compose -f docker-compose.prod.yml logs --tail 40 keel-serve >&2
          exit 1
          REMOTE

      # THE CHECK IS MADE FROM HERE AND NOT FROM THE BOX, over the public internet
      # and through Caddy, because that is the only path that proves what a
      # consumer gets: DNS resolving, the certificate valid, the proxy routing and
      # the API answering. `curl localhost:3000` on the host proves none of those
      # and passes when all four are broken.
      - name: The version the live API serves is the version this commit compiles
        if: vars.KEEL_DEPLOY_TARGET != ''
        env:
          HEALTH_URL: ${{ vars.KEEL_HEALTH_URL }}
        run: |
          set -euo pipefail
          echo "checking $HEALTH_URL"

          # Up to about a minute. The stack already reports healthy by now, so
          # this is covering DNS and, on a first deploy, an ACME certificate that
          # may still be seconds away. A TLS handshake failing because the
          # certificate has not been issued is indistinguishable here from one
          # failing because port 80 is shut; RUNBOOK.md section 9 is where that
          # gets diagnosed.
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$HEALTH_URL" > /tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 5
          done
          if [ ! -s /tmp/health.json ]; then
            echo "no answer from $HEALTH_URL" >&2
            echo "scripts/deploy/RUNBOOK.md section 9 is the diagnosis order." >&2
            exit 1
          fi
          cat /tmp/health.json

          # READ FROM THE SOURCE, NOT FROM A TOOLCHAIN, the same way the smoke
          # test does: `go run` would need Go on the runner at a version this
          # workflow never pinned, and the thing being compared is a constant in a
          # file that is right here. This form does not assume the version is a
          # draft, so it keeps working on the day the suffix comes off.
          want=$(grep -oE 'MethodologyVersion = "[^"]+"' internal/domain/types.go | head -1 | cut -d'"' -f2)
          test -n "$want" || { echo "could not read MethodologyVersion from internal/domain/types.go" >&2; exit 1; }
          got=$(python3 -c 'import json; print(json.load(open("/tmp/health.json"))["methodologyVersion"])')
          echo "live API reports $got, this commit compiles $want"
          if [ "$got" != "$want" ]; then
            echo "" >&2
            echo "THE DEPLOY DID NOT PUT THIS COMMIT LIVE." >&2
            echo "The API answered, so something is running: it is not this code." >&2
            echo "Check KEEL_IMAGE_TAG on the host and whether the pull succeeded." >&2
            exit 1
          fi

      # REPORTED AND NEVER ASSERTED ON. See the job header: degraded is the
      # correct answer for up to fifteen minutes after a deploy.
      - name: Report the health status without asserting on it
        if: vars.KEEL_DEPLOY_TARGET != ''
        run: |
          python3 -c 'import json; d=json.load(open("/tmp/health.json")); print("status:", d["status"], "assets:", d["assetsMonitored"], "historical:", d["historicalAvailable"])'

      - name: Say what was deployed
        if: vars.KEEL_DEPLOY_TARGET != '' && success()
        env:
          HEALTH_URL: ${{ vars.KEEL_HEALTH_URL }}
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| release | \`${{ github.ref_name }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| image | \`${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}\` |"
            echo "| health | ${HEALTH_URL} |"
            echo ""
            echo "The API answering at that URL reports the same methodology version this"
            echo "commit compiles. That is what this job asserts and it is the only thing it"
            echo "asserts."
            echo ""
            echo "A \`degraded\` status within about fifteen minutes of a deploy is correct and"
            echo "is not a failed deploy: the scanner runs on a fifteen minute interval and"
            echo "health reports degraded until a round has been recorded. RUNBOOK.md section 4."
            echo ""
            echo "**Rollback** is one line on the host, because every build is published under"
            echo "its own commit SHA. RUNBOOK.md section 5:"
            echo ""
            echo '```'
            echo "sed -i 's/^KEEL_IMAGE_TAG=.*/KEEL_IMAGE_TAG=<previous-sha>/' .env"
            echo "docker compose -f docker-compose.prod.yml pull"
            echo "docker compose -f docker-compose.prod.yml up -d keel-serve keel-scan"
            echo '```'
