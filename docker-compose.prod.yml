# Keel on one box. Four services, one volume, no ports open but 80 and 443.
#
# THIS IS NOT docker-compose.yml WITH DIFFERENT VALUES, and it is a separate file
# rather than an override for that reason. That file is a developer's Postgres on
# 5433 plus an optional locally built image. This one runs a published image from
# ghcr.io, a scanner, a reverse proxy holding certificates, and a database whose
# volume is the deliverable's data. Merging the two would mean one `docker compose
# up` on a laptop could address either, and the port comment in docker-compose.yml
# is the record of what that class of confusion already cost here.
#
# PREPARED, NOT APPLIED. Claude wrote this; the host, the DNS, the password and
# the secrets are Al's. Same split as .github/workflows/deploy.yml and
# scripts/s3-archive/. The runbook is scripts/vps-deploy/RUNBOOK.md and it is the
# document to read first: nothing here is meant to be understood from the YAML
# alone.
#
# Everything is addressed EXPLICITLY, because `docker compose` with no -f reads
# docker-compose.yml:
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# A LIVE KEEL IS THREE UNITS AND NOT ONE. The database, `serve`, and `scan`.
# Without the scanner the API is up, healthy in the process sense, and answers
# `degraded` with a 404 for every asset, because nothing has ever computed a
# metric. That is a correct API serving an empty database, and it is the state
# that reads as a working deployment to anybody checking only that the port
# answers.

# THE PROJECT NAME IS keel-prod AND IT IS NOT COSMETIC. With no `name:` at all,
# `docker compose` derives the project from the DIRECTORY, which makes this file
# and docker-compose.yml both the project `keel`, in the same clone. They would
# then share every named volume: this file's `keel_pgdata` and that file's
# `keel_pgdata` are one volume called `keel_keel_pgdata`, so a production stack
# started in a developer's checkout would attach the developer's database, and
# `docker compose down -v` against either file would destroy the other's data.
#
# The separate name is what makes the separation in the header above true rather
# than merely stated. Volumes here are keel-prod_*, and the two stacks cannot
# reach each other.
#
# EVERY container_name IS PREFIXED FOR THE SAME REASON AND IT IS A SEPARATE ONE.
# A container name is global to the Docker daemon and is NOT scoped by project,
# so `container_name: keel-postgres` in both files collides even once the
# projects are named apart: the second stack to start gets "the container name
# is already in use" and nothing else. Both of these were found by running this
# file in a checkout that already had the development stack up, which is the
# only place either one shows.
#
# THE SERVICE NAMES ARE NOT PREFIXED, on purpose. A service name is the network
# alias, so `keel-api` is the hostname the Caddyfile proxies to. Renaming a
# service means editing the Caddyfile in the same commit; renaming a container
# means nothing outside `docker ps`.
name: keel-prod

services:
  # ---------------------------------------------------------------- database
  #
  # NO PUBLISHED PORT. Not 5432, not 5433, none. Every client is on this network,
  # and a Postgres reachable from the internet on a box with one password is the
  # single worst thing this file could do. Reach it with `docker compose -f
  # docker-compose.prod.yml exec postgres psql -U keel -d keel`.
  postgres:
    image: postgres:16-alpine
    container_name: keel-prod-postgres
    environment:
      POSTGRES_USER: keel
      # NO DEFAULT, AND THE `:?` IS WHAT MAKES THAT TRUE. Compose refuses to
      # start and prints this text when KEEL_PG_PASSWORD is unset, which is the
      # behaviour worth having: a development password that works in production
      # is how `keel_dev_only` ends up guarding real data.
      POSTGRES_PASSWORD: ${KEEL_PG_PASSWORD:?set KEEL_PG_PASSWORD in .env, see scripts/vps-deploy/RUNBOOK.md section 4}
      POSTGRES_DB: keel
    volumes:
      - keel_pgdata:/var/lib/postgresql/data
      # migrations/ is NOT mounted into /docker-entrypoint-initdb.d, for the
      # reason docker-compose.yml gives at length: Postgres runs that directory
      # only on an empty data directory, so it would apply the first file once
      # and silently ignore every file after it. scripts/migrate.sh is the only
      # mechanism, in development and here.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------- the API
  #
  # THE SERVICE NAME IS THE PROXY'S HOSTNAME. Caddy reverse proxies to
  # `keel-api:3000`, which is this service's network alias. Renaming this
  # service means editing the Caddyfile in the same commit. The container name
  # below is a different thing and nothing depends on it.
  keel-api:
    image: ${KEEL_IMAGE:-ghcr.io/keel-official/keel-backend}:${KEEL_IMAGE_TAG:?set KEEL_IMAGE_TAG in .env, normally the commit SHA the deploy job wrote there}
    container_name: keel-prod-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # sslmode=disable is correct here and only here: this connection never
      # leaves the box, it crosses a private bridge network between two
      # containers. Requiring TLS would mean issuing a certificate for a
      # hostname that exists only inside Docker.
      KEEL_DSN: "postgres://keel:${KEEL_PG_PASSWORD:?set KEEL_PG_PASSWORD in .env}@postgres:5432/keel?sslmode=disable"
      # THE CORS ALLOWLIST. Exact origins, comma separated, read by
      # internal/api at startup: see api.CORSEnvVar. These are the DASHBOARD's
      # origins and not this API's own, which is the part that catches people
      # out. api.keels.app is a different origin from keels.app as far as a
      # browser is concerned, so the shared parent domain buys nothing and CORS
      # is required rather than a formality. Runbook section 6.
      #
      # It is read ONCE, when the process starts. Changing it in .env takes a
      # `docker compose -f docker-compose.prod.yml up -d keel-api` to take
      # effect, not a reload.
      KEEL_CORS_ORIGINS: ${KEEL_CORS_ORIGINS:?set KEEL_CORS_ORIGINS in .env, see scripts/vps-deploy/RUNBOOK.md section 6}
    # -historical STAYS OFF, WHICH IS FR-19 AND A ONE WORD CHANGE LATER. With it
    # off, a request for a past ledger gets 503 HISTORICAL_UNAVAILABLE, which is
    # the contract's own answer for a deployment holding no replayed rows.
    # Turning it on while the table is empty makes every historical request a 404
    # instead, which reads as "that ledger is missing" rather than "this
    # deployment does not do history". Track B is what fills that table; when it
    # has, add -historical here and restart.
    command: ["serve", "-addr", ":3000"]
    # NO PUBLISHED PORT, deliberately. Caddy is the only route in, so there is no
    # way to reach the API over plain HTTP from outside and no second address
    # that skips the proxy. `curl localhost:3000` on the host will not answer,
    # and that is the design rather than a fault: use
    # `docker compose -f docker-compose.prod.yml exec caddy wget -qO- http://keel-api:3000/v1/health`.
    expose:
      - "3000"
    restart: unless-stopped
    # No healthcheck, for the reason docker-compose.yml states: this image is
    # distroless and holds no shell and no curl, so a CMD-SHELL probe cannot run
    # inside it, and adding a binary to test the process from within would widen
    # the image to answer a question the outside can already ask. GET
    # /v1/health, through Caddy, is the check, and the deploy job runs it.

  # ---------------------------------------------------------------- the scanner
  #
  # WITHOUT THIS THE API SERVES NOTHING. `scan` is what computes the metrics rows
  # the API reads; the API never calls Horizon itself, which is rule 1 of
  # internal/api's brief. It is a long-lived process with an interval rather than
  # a cron, which is the same reason the recommended shape is a box and not a
  # per-request platform.
  #
  # 15 MINUTES IS THE BINARY'S OWN DEFAULT and is written out rather than left
  # implicit, because the interval is the deployment's decision and a reader
  # should not have to open cmd/keel/scan.go to find out what it is. The Horizon
  # budget is 3000 requests an hour under NFR-6, against roughly three requests
  # per pair per round.
  keel-scan:
    image: ${KEEL_IMAGE:-ghcr.io/keel-official/keel-backend}:${KEEL_IMAGE_TAG:?set KEEL_IMAGE_TAG in .env}
    container_name: keel-prod-scan
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEEL_DSN: "postgres://keel:${KEEL_PG_PASSWORD:?set KEEL_PG_PASSWORD in .env}@postgres:5432/keel?sslmode=disable"
    command: ["scan", "-interval", "15m"]
    restart: unless-stopped

  # ---------------------------------------------------------------- TLS
  #
  # THE ONLY SERVICE WITH PORTS. 80 and 443, and both are required: see the
  # runbook, section 3. 443/udp is HTTP/3 and is the one line here that is
  # optional.
  caddy:
    image: caddy:2-alpine
    container_name: keel-prod-caddy
    depends_on:
      - keel-api
    environment:
      # The hostname. api.keels.app is the documented value and it lives in .env
      # and in the runbook, never in the Caddyfile. Unset, Caddy will not start;
      # the Caddyfile's global block records the misleading error it prints.
      KEEL_DOMAIN: ${KEEL_DOMAIN:?set KEEL_DOMAIN in .env, normally api.keels.app, see scripts/vps-deploy/RUNBOOK.md section 2}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data HOLDS THE CERTIFICATES AND THE ACME ACCOUNT KEY, and losing it
      # means re-issuing on the next start. Let's Encrypt allows 5 duplicate
      # certificates for the same name per week, so a container recreated a few
      # times with no volume can exhaust that and leave the site without TLS for
      # days. This is the volume not to prune.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # ---------------------------------------------------------------- the dump
  #
  # A DAILY pg_dump TO A HOST DIRECTORY, and it is the least clever thing that
  # answers the requirement. It is a sidecar rather than a host cron entry
  # because a cron line lives outside this file, is invisible to anybody reading
  # it, and does not survive rebuilding the box from the repository.
  #
  # WHAT IT IS NOT. It is not offsite, it is not encrypted, and it is not
  # verified by restoring. A dump on the same disk as the database survives a
  # dropped table and a bad migration; it does not survive losing the box. The
  # step that makes it offsite is scripts/s3-archive/, which is prepared and not
  # applied, and pointing this at a bucket is a decision about where the
  # deliverable's data lives, so it is Al's. Runbook section 8.
  #
  # THE IMAGE IS PINNED TO THE SERVER'S MAJOR VERSION. pg_dump refuses to dump a
  # server newer than itself, so postgres:16-alpine here is not a coincidence
  # and moving one of these two lines means moving both.
  db-dump:
    image: postgres:16-alpine
    container_name: keel-prod-db-dump
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: keel
      PGDATABASE: keel
      PGPASSWORD: ${KEEL_PG_PASSWORD:?set KEEL_PG_PASSWORD in .env}
      # Days of dumps to keep. Fourteen at a few MB each is nothing on disk and
      # is longer than a weekend plus the time it takes to notice.
      KEEP_DAYS: ${KEEL_DUMP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/dumps
    # EVERY 24 HOURS FROM CONTAINER START, not at a fixed hour. A sleep loop
    # cannot promise 03:00 and pretending otherwise in a comment is how a runbook
    # starts lying; `ls backups/` shows the real cadence. The first dump is taken
    # immediately, so the very first deploy proves this works instead of leaving
    # it to be discovered a day later.
    #
    # The dump is written to a .partial name and moved into place only on
    # success, so a dump interrupted halfway is never left looking like a good
    # one. A failure is loud in the logs and does NOT stop the loop: one failed
    # dump must not cost every later dump.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        echo "db-dump: keeping $${KEEP_DAYS} days of dumps in /dumps"
        while true; do
          ts=$$(date -u +%Y-%m-%dT%H%M%SZ)
          out="/dumps/keel-$${ts}.dump"
          if pg_dump -Fc -f "$${out}.partial"; then
            mv "$${out}.partial" "$${out}"
            echo "db-dump: wrote $${out} ($$(du -h "$${out}" | cut -f1))"
          else
            rm -f "$${out}.partial"
            echo "db-dump: FAILED at $${ts}" >&2
          fi
          find /dumps -name 'keel-*.dump' -type f -mtime "+$${KEEP_DAYS}" -delete
          sleep 86400
        done
    restart: unless-stopped

volumes:
  keel_pgdata:
  caddy_data:
  caddy_config:
