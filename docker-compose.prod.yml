# Keel on one small VPS. Three services, three volumes, two ports.
#
# scripts/deploy/RUNBOOK.md IS THE DOCUMENT TO READ FIRST. Nothing here is meant to
# be understood from the YAML alone, and every long explanation lives there rather
# than in both places.
#
# PREPARED, NOT APPLIED. The box, its DNS, its password and the repository secrets
# are Al's. No secret value is in this file: every one is a `${VAR:?}` reference
# resolved from a `.env` beside it, and the `:?` form stops compose with the
# variable's name instead of starting something half configured. See env.example.
#
# NO POSTGRES HERE SINCE 11 SEPTEMBER 2026: the box already runs one. Gone with it,
# the `keel_pgdata` volume, `POSTGRES_PASSWORD`, and the `depends_on` gates. AND THE
# MIGRATION TRANSPORT INVERTED: `docker compose exec -T postgres psql` no longer
# exists, so `KEEL_MIGRATE_DSN=... bash scripts/migrate.sh` is the only one left.
# RUNBOOK.md sections 3.5 and 9.
#
# Addressed explicitly, because `docker compose` with no -f reads
# docker-compose.yml, which is the developer's Postgres and not this:
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# A LIVE KEEL IS THREE UNITS: the database, `serve` and `scan`. Two are here and the
# database is the host's. Without the scanner the API is up, healthy in every
# mechanical sense, and answers `degraded` with a 404 for every asset.
#
# `name: keel-prod` IS NOT COSMETIC. With no name, compose derives the project from
# the directory, so this file and docker-compose.yml would share every named volume
# in the same clone. Container names are prefixed for a second reason: they are
# global to the daemon and not scoped by project. Service names are NOT prefixed,
# because they are the network aliases the Caddyfile proxies to.
#
# The image is published for amd64 and arm64. Memory limits total about 576 MB, and
# the host's Postgres needs its own on top of that.
name: keel-prod

services:
  # ---------------------------------------------------------------- the API
  keel-serve:
    image: ${KEEL_IMAGE:-ghcr.io/keel-official/keel-backend}:${KEEL_IMAGE_TAG:?set KEEL_IMAGE_TAG in .env to a commit SHA, see scripts/deploy/RUNBOOK.md section 3.4}
    container_name: keel-prod-serve
    # NOTHING GATES STARTUP: a depends_on can only wait for a container in this
    # project and the database is not in it. `serve` therefore crash loops until
    # Postgres answers and the migration has run. Noisy, correct, and never
    # silent: read `docker logs keel-prod-serve` first.
    extra_hosts:
      # `host-gateway` is what creates this name; on Linux it does not exist
      # otherwise. It is how KEEL_DSN reaches a Postgres installed on the host.
      # IF THAT POSTGRES IS ITSELF A CONTAINER, drop this and put both keel
      # services on its network with `networks: [dbnet]` plus an `external: true`
      # entry beside the volumes block.
      - "host.docker.internal:host-gateway"
    environment:
      # Read by cmd/keel/serve.go as envOr("KEEL_DSN", ...), so no -dsn flag.
      # THE HOSTNAME IS THE MOST LIKELY THING TO BE WRONG. `localhost` is the
      # container itself, `postgres` is the removed service, 5433 is a
      # docker-compose.yml port. All three fail as a 502. RUNBOOK.md section 9.
      KEEL_DSN: ${KEEL_DSN:?set KEEL_DSN in .env, see scripts/deploy/RUNBOOK.md section 3.4}
      # The DASHBOARD's origins, not this API's own: api.keels.app and keels.app
      # are different origins to a browser. Read once at startup, so a change
      # needs `up -d keel-serve`. RUNBOOK.md section 7.
      KEEL_CORS_ORIGINS: ${KEEL_CORS_ORIGINS:?set KEEL_CORS_ORIGINS in .env, see scripts/deploy/RUNBOOK.md section 7}
      # The pool, and the deadline on the connection check at startup. ALL FIVE
      # ARE OPTIONAL: unset here means empty, which cmd/keel/env.go reads as
      # unset and answers with store.DefaultConfig. They are passed through
      # rather than omitted so that setting one in .env is enough, with no edit
      # to this file. KEEL_DB_PING_TIMEOUT is the one that matters on this host:
      # a KEEL_DSN naming a hostname that drops packets hangs the container's
      # startup without it, instead of crash looping with a readable error.
      KEEL_DB_MAX_OPEN_CONNS: ${KEEL_DB_MAX_OPEN_CONNS:-}
      KEEL_DB_MAX_IDLE_CONNS: ${KEEL_DB_MAX_IDLE_CONNS:-}
      KEEL_DB_CONN_MAX_LIFETIME: ${KEEL_DB_CONN_MAX_LIFETIME:-}
      KEEL_DB_CONN_MAX_IDLE_TIME: ${KEEL_DB_CONN_MAX_IDLE_TIME:-}
      KEEL_DB_PING_TIMEOUT: ${KEEL_DB_PING_TIMEOUT:-}
    # NO -historical: with the flag off a past ledger returns 503
    # HISTORICAL_UNAVAILABLE, which is true of a deployment holding no replayed
    # rows. On, the same request would 404, which says the wrong thing. Adding
    # "-historical" here plus `up -d keel-serve` is the whole flip.
    command: ["serve", "-addr", ":3000"]
    # NO PUBLISHED PORT. Caddy is the only route in, so there is no second address
    # that skips TLS and `curl localhost:3000` on the host will not answer.
    expose:
      - "3000"
    # NO HEALTHCHECK HERE: the image is distroless, with no shell and no HTTP
    # client, so nothing inside it can probe itself. The probe is on caddy.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M

  # ---------------------------------------------------------------- the scanner
  #
  # WITHOUT THIS THE API SERVES NOTHING: it produces the rows the API reads, and
  # the API never calls Horizon itself. Same image and same tag as keel-serve on
  # purpose; two tags would compute and serve under different methodology
  # versions. 15m is also the binary's default, written out because the interval is
  # the deployment's decision. NFR-6 caps this repository at 3000 Horizon requests
  # an hour.
  keel-scan:
    image: ${KEEL_IMAGE:?set KEEL_IMAGE in .env}
    container_name: keel-prod-scan
    # Same DSN as keel-serve and it must stay the same. Two different ones and the
    # API serves an empty database while the scanner fills another.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KEEL_DSN: ${KEEL_DSN:?set KEEL_DSN in .env}
      KEEL_DB_MAX_OPEN_CONNS: ${KEEL_DB_MAX_OPEN_CONNS:-}
      KEEL_DB_MAX_IDLE_CONNS: ${KEEL_DB_MAX_IDLE_CONNS:-}
      KEEL_DB_CONN_MAX_LIFETIME: ${KEEL_DB_CONN_MAX_LIFETIME:-}
      KEEL_DB_CONN_MAX_IDLE_TIME: ${KEEL_DB_CONN_MAX_IDLE_TIME:-}
      KEEL_DB_PING_TIMEOUT: ${KEEL_DB_PING_TIMEOUT:-}
    command: ["scan", "-interval", "15m"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------- TLS
  #
  # THE ONLY SERVICE WITH PORTS, and 80 is required even though the API is HTTPS
  # only: Caddy solves the ACME HTTP-01 challenge there. RUNBOOK.md section 3.2.
  caddy:
    image: caddy:2-alpine
    container_name: keel-prod-caddy
    depends_on:
      - keel-serve
    environment:
      # Lives in .env and in the runbook, never in the Caddyfile. Unset, Caddy
      # will not start. RUNBOOK.md section 2.
      KEEL_DOMAIN: ${KEEL_DOMAIN:?set KEEL_DOMAIN in .env, normally api.keels.app, see scripts/deploy/RUNBOOK.md section 2}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data HOLDS THE CERTIFICATES AND THE ACME ACCOUNT KEY. Let's Encrypt
      # allows five duplicate certificates per name per week, so recreating this
      # container without the volume a few times can leave the site without TLS
      # for days. This is the volume not to prune.
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    # THE API'S PROBE LIVES HERE because this is the only container in the stack
    # with an HTTP client, and probing from here covers the proxy hop too.
    #
    # IT ASSERTS HTTP 200 AND NEVER READS THE STATUS FIELD. `degraded` is a correct
    # 200: the handler reports it whenever no scan has been recorded, which is
    # every deployment for up to fifteen minutes after first boot. Treating it as a
    # failure would restart a working API.
    #
    # start_period matters more without the database gate: `serve` may be crash
    # looping in that window for a fault that is not caddy's.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://keel-serve:3000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

# keel_pgdata left with the postgres service, so this stack now owns no persistent
# data except Caddy's certificates, and `down -v` can no longer destroy the
# deliverable's dataset.
volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
