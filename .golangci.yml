version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive

  settings:
    misspell:
      # The repository language is English as of DEC-005, so a US dictionary is
      # now the right one. Before that decision this linter flagged Indonesian
      # words as misspellings, which was a false positive on every comment.
      locale: US

  exclusions:
    rules:
      # Stubs that panic on purpose until the methodology is written. Remove this
      # exclusion once internal/depth has a body.
      - path: internal/depth/
        text: "not implemented"

formatters:
  enable:
    - gofmt
