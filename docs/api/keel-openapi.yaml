          type: integer
        methodologyVersion:
          type: string
        historicalAvailable:
          type: boolean
          description: False kalau jalur Hubble sedang tidak tersedia

    Methodology:
      type: object
      required: [version, documentUrl, calibrated, thresholds]
      properties:
        version:
          type: string
        documentUrl:
          type: string
          format: uri
        calibrated:
          type: boolean
          description: Selalu false pada v1. Ambang dipilih, bukan dikalibrasi.
        calibrationNote:
          type: string
        thresholds:
          type: object
          description: |
            Peta ambang bernama. Bersifat terbuka: kunci baru dapat muncul tanpa
            menaikkan versi mayor API, jadi konsumen wajib membacanya lewat nama
            kunci, bukan posisi.

            Konvensi satuan: setiap kunci berakhiran `Pct` dinyatakan dalam persen,
            bukan pecahan. `spreadExtremePct: '20.0'` berarti 20 persen dan
            dibandingkan langsung dengan `spreadPct` pada respons aset.
          additionalProperties: true
          properties:
            spreadExtremePct:
              allOf: [$ref: '#/components/schemas/Decimal']
              description: |
                Ambang pemicu SPREAD_EXTREME, dalam persen. Di atas ambang ini
                harga acuan dianggap tidak bermakna dan aset masuk band HIGH.
            oracleWindowSeconds:
              type: integer
              description: |
                Panjang jendela waktu yang diasumsikan dipakai oracle untuk
                meratakan harga, dalam detik. Dipakai sebagai pembanding volume
                asli pada `oracleResistance`. Ambang ini dipilih, bukan dibaca
                dari oracle mana pun, karena tiap oracle punya jendela sendiri.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INVALID_ASSET_ID
                - INVALID_RANGE
                - ASSET_NOT_MONITORED
                - LEDGER_NOT_AVAILABLE
                - HISTORICAL_UNAVAILABLE
                - RATE_LIMITED
            message:
              type: string
              description: Pesan yang boleh ditampilkan langsung ke pengguna
            detail:
              type: object
              additionalProperties: true

  responses:

    BadRequest:
      description: Parameter tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            assetIdSalah:
              value:
                error:
                  code: INVALID_ASSET_ID
                  message: >-
                    Format assetId tidak valid. Gunakan CODE:ISSUER untuk aset
                    terbitan atau XLM untuk aset native.
            rentangTerlaluPanjang:
              value:
                error:
                  code: INVALID_RANGE
                  message: Rentang maksimal 90 hari per permintaan.
                  detail:
                    requestedLedgers: 1200000
                    maxLedgers: 1555200

    NotFound:
      description: |
        Aset tidak dipantau, atau ledger yang diminta tidak tersedia. Keduanya
        adalah kondisi yang wajar, bukan kegagalan sistem.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            asetTidakDipantau:
              value:
                error:
                  code: ASSET_NOT_MONITORED
                  message: >-
                    Aset ini tidak termasuk dalam demonstration set. Lihat
                    GET /v1/assets untuk daftar aset yang dipantau.
            ledgerBelumTersedia:
              value:
                error:
                  code: LEDGER_NOT_AVAILABLE
                  message: >-
                    Data historis untuk ledger ini belum tersedia. Data historis
                    diperbarui dalam batch harian.
                  detail:
                    requestedLedger: 61999999
                    earliestAvailable: 60100000
                    latestAvailable: 61180000

    HistoricalUnavailable:
      description: Jalur historis sedang tidak tersedia. Jalur live tidak terpengaruh.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: HISTORICAL_UNAVAILABLE
              message: >-
                Layanan data historis sedang tidak tersedia. Metrik terkini
                tetap dapat diakses tanpa parameter ledger.

    RateLimited:
      description: Melebihi 60 request per menit
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: RATE_LIMITED
              message: Batas 60 request per menit terlampaui.

