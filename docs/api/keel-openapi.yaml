openapi: 3.1.0

info:
  title: Keel Liquidity Risk API
  version: 1.1.0
  description: |
    API read-only untuk metrik risiko likuiditas aset Stellar.

    Keel mengukur kedalaman likuiditas efektif (effective depth) per aset dari
    orderbook SDEX dan reserve AMM pool, lalu menurunkan biaya manipulasi harga
    dan rekomendasi ukuran collateral maksimum yang aman.

    ## Yang perlu diketahui sebelum memakai API ini

    **1. Seluruh nilai numerik dikirim sebagai string, bukan number.**
    Amount Stellar adalah int64 dalam stroop dengan 7 desimal. JSON number adalah
    IEEE 754 double dan akan kehilangan presisi. Konsumen wajib memakai library
    desimal (decimal.js, big.js) dan tidak boleh melakukan aritmetika dengan
    parseFloat. Satu-satunya field numerik yang dikirim sebagai number adalah
    `delta` (0.02, 0.05, 0.10) dan hitungan bilangan bulat seperti `ledgerSeq`.

    **2. Metrik selalu sedikit tertinggal.** API membaca hasil yang sudah
    dihitung, bukan menghitung saat request masuk. Header
    `X-Keel-Staleness-Seconds` menyatakan seberapa lama. Target maksimal 900 detik.

    **3. Aset tanpa harga bukan error.** Aset tanpa orderbook dan tanpa pool
    mengembalikan HTTP 200 dengan `priceSource: "none"` dan band `CRITICAL`.
    Itu temuan bernilai tinggi, bukan kegagalan. Jangan tampilkan sebagai error.

    **4. Tidak ada SLA.** Ini proof of concept yang didanai Instawards. Jangan
    dipakai sebagai satu-satunya dasar keputusan finansial.

    **5. Keel permanen read-only.** Tidak ada endpoint yang menulis apa pun ke
    jaringan Stellar. Tidak ada autentikasi karena tidak ada data pengguna.

    **6. Buku rusak bukan error, dan bukan kondisi normal.** Sebuah aset dapat
    punya orderbook dengan spread ratusan persen. Ketika itu terjadi, `midPrice`
    tetap dikirim tetapi tidak bermakna, `spreadPct` bernilai besar, dan flag
    `SPREAD_EXTREME` menyala. Metrik turunan `midPrice`, termasuk tangga depth
    2/5/10 persen, ikut kehilangan makna. Tampilan untuk keadaan ini harus
    dirancang terpisah dari aset sehat maupun dari aset tanpa harga. Lihat contoh
    respons `assetBrokenBook`.

    **7. `cost` pada `manipulationCost` tidak boleh dibaca sendirian.** Selalu
    baca bersama `reachable`. Biaya nol dengan `reachable: true` berarti harga
    sasaran gratis. Biaya nol dengan `reachable: false` berarti tidak ada
    likuiditas sama sekali di rentang itu, sehingga harga tidak dapat digeser
    bertahap ke sana. Dua keadaan yang berlawanan arti.

  contact:
    name: Ciganytry
    email: radenistri@gmail.com
  license:
    name: MIT

servers:
  - url: https://api.keel.example/v1
    description: Produksi (tanpa SLA)
  - url: http://localhost:3000/v1
    description: Lokal

tags:
  - name: assets
    description: Metrik risiko per aset
  - name: meta
    description: Kesehatan layanan dan versi metodologi

paths:

  /health:
    get:
      tags: [meta]
      summary: Status layanan
      operationId: getHealth
      responses:
        '200':
          description: Layanan hidup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                latestScanAt: '2026-08-19T04:15:00Z'
                latestScanLedgerSeq: 61234567
                assetsMonitored: 53
                methodologyVersion: 1.0.1
                historicalAvailable: true

  /methodology:
    get:
      tags: [meta]
      summary: Versi metodologi dan ambang yang berlaku
      description: |
        Mengembalikan versi metodologi aktif beserta seluruh nilai ambang yang
        dipakai untuk mengevaluasi flag. Ambang ini dipilih, bukan dikalibrasi
        terhadap kumpulan insiden. Konsumen dianjurkan menerapkan ambang sendiri
        dengan membaca flag individual.
      operationId: getMethodology
      responses:
        '200':
          description: Metodologi aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Methodology'
              example:
                version: 1.0.1
                documentUrl: https://github.com/ciganytry/keel/blob/main/docs/methodology/00-ikhtisar.md
                calibrated: false
                calibrationNote: >-
                  Ambang dipilih berdasarkan besaran insiden Blend Mei 2026 dan
                  penilaian konservatif, bukan dikalibrasi terhadap kumpulan
                  insiden. Seluruh flag dilaporkan terpisah agar konsumen dapat
                  menerapkan ambang sendiri.
                thresholds:
                  manipulationCheapAbsolute: '10000.0000000'
                  manipulationCheapUnit: XLM
                  manipulationRatioLowPct: '1.0'
                  thinDepth5PctAbsolute: '50000.0000000'
                  thinDepth5PctUnit: XLM
                  holderTop1ExtremePct: '50.0'
                  holderTop10HighPct: '80.0'
                  genuineTradeStaleDays: 30
                  genuineTradeWarnDays: 7
                  washTradeSuspectedPct: '50.0'
                  spreadExtremePct: '20.0'
                  oracleWindowSeconds: 300
                  ammFeeBp: 30

  /assets:
    get:
      tags: [assets]
      summary: Daftar aset yang dipantau
      operationId: listAssets
      parameters:
        - $ref: '#/components/parameters/Band'
        - $ref: '#/components/parameters/HasFlag'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Daftar aset
          headers:
            X-Keel-Staleness-Seconds:
              $ref: '#/components/headers/Staleness'
            X-Keel-Methodology-Version:
              $ref: '#/components/headers/MethodologyVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
              examples:
                campuran:
                  $ref: '#/components/examples/AssetListMixed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /asset/{assetId}/depth:
    get:
      tags: [assets]
      summary: Metrik risiko terkini atau pada ledger historis
      description: |
        Tanpa parameter `ledger`, mengembalikan hasil scan terbaru dari Horizon.
        Dengan parameter `ledger`, mengembalikan hasil replay historis dari Hubble.

        Jalur historis bersifat batch dan tidak menjamin ketersediaan untuk
        sembarang ledger. Kalau ledger yang diminta belum tersedia, respons
        adalah 404 dengan kode `LEDGER_NOT_AVAILABLE`, bukan 500.
      operationId: getAssetDepth
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/Quote'
        - $ref: '#/components/parameters/Ledger'
      responses:
        '200':
          description: |
            Metrik risiko. Perhatikan bahwa aset tanpa harga eksekutabel juga
            mengembalikan 200, dengan `priceSource: "none"` dan band `CRITICAL`.
          headers:
            X-Keel-Staleness-Seconds:
              $ref: '#/components/headers/Staleness'
            X-Keel-Methodology-Version:
              $ref: '#/components/headers/MethodologyVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetRisk'
              examples:
                asetSehat:
                  $ref: '#/components/examples/AssetHealthy'
                hanyaPool:
                  $ref: '#/components/examples/AssetPoolOnly'
                tanpaHarga:
                  $ref: '#/components/examples/AssetNoPrice'
                bukuRusak:
                  $ref: '#/components/examples/AssetBrokenBook'
                replayHistoris:
                  $ref: '#/components/examples/AssetHistorical'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/HistoricalUnavailable'

  /asset/{assetId}/history:
    get:
      tags: [assets]
      summary: Deret waktu metrik pada rentang ledger
      description: |
        Dipakai dashboard untuk kurva tren dan halaman studi kasus Blend.
        Rentang maksimal 90 hari per permintaan.
      operationId: getAssetHistory
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/Quote'
        - name: from
          in: query
          required: true
          description: Ledger sequence awal, inklusif
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 60890000
        - name: to
          in: query
          required: true
          description: Ledger sequence akhir, inklusif
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 60950000
        - name: resolution
          in: query
          description: Interval agregasi titik data
          schema:
            type: string
            enum: [hour, day]
            default: day
      responses:
        '200':
          description: Deret waktu
          headers:
            X-Keel-Methodology-Version:
              $ref: '#/components/headers/MethodologyVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
              examples:
                deretUstry:
                  $ref: '#/components/examples/HistoryUstry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/HistoricalUnavailable'

components:

  parameters:

    AssetId:
      name: assetId
      in: path
      required: true
      description: |
        Identitas aset. Format `CODE:ISSUER` untuk aset terbitan, atau `XLM`
        untuk aset native. Tanda titik dua tidak perlu di-encode, tetapi
        konsumen yang memakai URL builder ketat boleh meng-encode-nya sebagai `%3A`.
      schema:
        type: string
        pattern: '^(XLM|[A-Za-z0-9]{1,12}(:|%3A)G[A-Z2-7]{55})$'
      examples:
        terbitan:
          value: USDC:GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
        native:
          value: XLM

    Quote:
      name: quote
      in: query
      description: |
        Aset quote yang dipakai sebagai satuan pengukuran. Kalau tidak diisi,
        dipakai pasangan primer aset tersebut, yaitu pasangan dengan depth
        gabungan terbesar di 10 persen.
      schema:
        type: string
        pattern: '^(XLM|[A-Za-z0-9]{1,12}(:|%3A)G[A-Z2-7]{55})$'
      example: XLM

    Ledger:
      name: ledger
      in: query
      description: |
        Ledger sequence untuk replay historis. Kalau diisi, `dataSource` pada
        respons akan bernilai `hubble`.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 60912345

    Band:
      name: band
      in: query
      description: Saring berdasarkan band risiko
      schema:
        type: string
        enum: [LOW, MEDIUM, HIGH, CRITICAL]

    HasFlag:
      name: hasFlag
      in: query
      description: Saring aset yang memicu flag tertentu
      schema:
        $ref: '#/components/schemas/Flag'

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  headers:

    Staleness:
      description: |
        Berapa detik data ini tertinggal dari ledger terkini saat dihitung.
        Untuk respons historis, nilainya 0 karena data historis tidak basi.
      schema:
        type: integer
      example: 412

    MethodologyVersion:
      description: Versi metodologi yang menghasilkan angka pada respons ini
      schema:
        type: string
      example: 1.0.0

  schemas:

    Decimal:
      type: string
      description: |
        Nilai desimal presisi tinggi sebagai string. JANGAN parseFloat.
        Pakai library desimal untuk aritmetika apa pun.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      example: '124533.4821900'

    AssetType:
      type: string
      description: |
        Jenis aset menurut XDR Stellar, dikirim eksplisit oleh Keel.

        Konsumen TIDAK boleh menyimpulkan jenis dari panjang `code`. Kode
        sepanjang 4 karakter atau kurang dapat diterbitkan sebagai
        `credit_alphanum12`, dan Horizon melaporkannya apa adanya. Menebak dari
        panjang kode menghasilkan identitas aset yang berbeda dari aset yang
        sebenarnya diukur.
      enum: [native, credit_alphanum4, credit_alphanum12]
      example: credit_alphanum4

    Asset:
      type: object
      required: [code, type, issuer]
      properties:
        code:
          type: string
          example: USDC
        type: { $ref: '#/components/schemas/AssetType' }
        issuer:
          type: [string, 'null']
          description: |
            Null jika dan hanya jika `type` bernilai `native`. Untuk kedua jenis
            credit, issuer selalu terisi.
          example: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN

    DataSource:
      type: string
      description: |
        Asal data yang dipakai menghitung respons ini.

        `horizon` scan live dari orderbook dan pool terkini.
        `hubble` replay state historis dari snapshot.
        `trades-implied` state orderbook pada ledger tersebut tidak tersedia,
        sehingga harga dan likuiditas direkonstruksi dari catatan trade yang
        benar-benar tereksekusi. Nilai ini selalu disertai `warnings`, dan seluruh
        angka depth yang dihasilkannya adalah batas bawah, bukan pengukuran
        penuh: trade membuktikan likuiditas yang terpakai, bukan likuiditas yang
        tersedia. Jangan tampilkan hasil `trades-implied` setara hasil `horizon`.
      enum: [horizon, hubble, trades-implied]

    Flag:
      type: string
      description: |
        Kondisi risiko yang terpicu. Flag dilaporkan individual agar konsumen
        dapat menerapkan kebijakan sendiri, tidak hanya bergantung pada band.
      enum:
        - NO_EXECUTABLE_PRICE
        - ZERO_DEPTH_2PCT
        - MANIPULATION_CHEAP
        - MANIPULATION_RATIO_LOW
        - NO_GENUINE_TRADE_30D
        - NO_GENUINE_TRADE_7D
        - HOLDER_CONCENTRATION_EXTREME
        - HOLDER_CONCENTRATION_HIGH
        - THIN_DEPTH_5PCT
        - WASH_TRADE_SUSPECTED
        - SPREAD_EXTREME

    Band:
      type: string
      description: Flag terburuk yang terpicu. Bukan hasil pembobotan.
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    DepthPoint:
      type: object
      required: [delta, buySide, sellSide, fromSdex, fromAmm]
      properties:
        delta:
          type: number
          description: Pergeseran harga relatif, 0.02 berarti 2 persen
          enum: [0.02, 0.05, 0.1]
        buySide:
          allOf: [$ref: '#/components/schemas/Decimal']
          description: |
            Notional dalam aset quote yang dapat diserap dengan membeli sebelum
            harga marginal melewati P0 dikali (1 + delta). Relevan untuk risiko
            manipulasi oracle.
        sellSide:
          allOf: [$ref: '#/components/schemas/Decimal']
          description: |
            Notional dalam aset quote yang dapat diserap dengan menjual sebelum
            harga marginal jatuh di bawah P0 dikali (1 - delta). Relevan untuk
            risiko likuidasi.
        fromSdex:
          allOf: [$ref: '#/components/schemas/Decimal']
          description: Kontribusi orderbook SDEX pada sisi beli, untuk transparansi
        fromAmm:
          allOf: [$ref: '#/components/schemas/Decimal']
          description: Kontribusi AMM pool pada sisi beli, untuk transparansi

    ManipulationCost:
      type: object
      description: |
        Satu anak tangga simulasi manipulasi harga naik. Tangga penuh adalah
        0.5, 1, 10, dan 100. Tangga besar sengaja disertakan karena aset dengan
        buku rusak justru tidak terbaca oleh tangga kecil.
      required: [delta, targetPrice, cost, reachable]
      properties:
        delta:
          type: number
          description: |
            Kenaikan harga relatif yang disimulasikan. 0.5 berarti naik 50 persen,
            100 berarti naik 10000 persen.
          enum: [0.5, 1, 10, 100]
        targetPrice:
          allOf: [$ref: '#/components/schemas/Decimal']
          description: |
            Harga sasaran simulasi, yaitu `midPrice` dikali (1 + delta). Dikirim
            agar konsumen tidak perlu menghitung ulang dan agar tangga tetap
            terbaca ketika `midPrice` sendiri tidak masuk akal.
        cost:
          allOf: [$ref: '#/components/schemas/Decimal']
          description: |
            Notional dalam aset quote yang dibutuhkan untuk menyerap seluruh ask
            yang berada di bawah `targetPrice`. WAJIB dibaca bersama `reachable`.
        reachable:
          type: boolean
          description: |
            True kalau `targetPrice` benar-benar dapat dicapai dengan menyerap
            likuiditas secara bertahap. False kalau likuiditas habis sebelum
            `targetPrice` tercapai, sehingga harga hanya dapat melompat ke ask
            terdekat yang tersedia, bukan digeser ke sasaran.

            Kombinasi yang harus dibedakan tampilannya:

            | cost | reachable | arti |
            |---|---|---|
            | 0 | true | harga sasaran dapat dicapai tanpa biaya |
            | 0 | false | tidak ada likuiditas sama sekali dalam rentang itu |
            | > 0 | true | biaya nyata untuk mencapai sasaran |
            | > 0 | false | biaya menghabiskan seluruh ask, tetap tidak sampai sasaran |

            Lihat juga `maxReachablePrice`.

    OracleResistance:
      type: object
      description: |
        Ketahanan aset terhadap manipulasi harga oracle. Menjawab satu
        pertanyaan: apakah menggeser harga ke tingkat kritis lebih murah
        daripada volume perdagangan asli yang benar-benar terjadi selama jendela
        waktu yang dipakai oracle.

        Biaya manipulasi sendirian tidak cukup. Biaya 10000 XLM murah untuk aset
        yang diperdagangkan 5 juta XLM sehari, dan mahal untuk aset yang
        diperdagangkan 200 XLM sehari. Perbandingan itulah yang dilaporkan di
        sini, bukan biaya mentahnya saja.
      required: [criticalDelta, manipulationCost, reachable, genuineVolume, windowSeconds]
      properties:
        criticalDelta:
          type: number
          description: |
            Delta yang diperlakukan sebagai ambang kritis untuk aset ini. Sama
            dengan salah satu nilai `delta` pada `manipulationCost`.
          example: 0.5
        manipulationCost:
          allOf: [$ref: '#/components/schemas/Decimal']
          description: |
            Nilai `cost` dari entri `manipulationCost` pada `criticalDelta`,
            disalin agar konsumen tidak perlu mencocokkan sendiri.
        reachable:
          type: boolean
          description: |
            Nilai `reachable` dari entri yang sama. Kalau false, `manipulationCost`
            di atas tidak menyatakan biaya mencapai sasaran, dan `ratio` bernilai
            null.
        genuineVolume:
          allOf: [$ref: '#/components/schemas/Decimal']
          description: |
            Volume trade asli dalam aset quote selama `windowSeconds` terakhir,
            setelah aturan penyaringan trade asli diterapkan. Ini pembanding
            biaya manipulasi.
        windowSeconds:
          type: integer
          description: |
            Panjang jendela pengamatan dalam detik, sama dengan
            `oracleWindowSeconds` pada GET /methodology. Dikirim ulang di sini
            supaya respons dapat dibaca tanpa memanggil endpoint lain.
          example: 300
        ratio:
          oneOf: [$ref: '#/components/schemas/Decimal', type: 'null']
          description: |
            `manipulationCost` dibagi `genuineVolume`. Nilai di bawah 1 berarti
            menggeser harga ke tingkat kritis lebih murah daripada seluruh
            perdagangan asli sepanjang jendela oracle. Null kalau `genuineVolume`
            nol atau `reachable` false, karena pembagiannya tidak bermakna.

    VolumeToSupply:
      type: object
      required: [d1, d7, d30]
      properties:
        d1: { $ref: '#/components/schemas/Decimal' }
        d7: { $ref: '#/components/schemas/Decimal' }
        d30: { $ref: '#/components/schemas/Decimal' }

    LastGenuineTrade:
      type: object
      required: [ledgerSeq, at]
      properties:
        ledgerSeq:
          type: integer
          format: int64
        at:
          type: string
          format: date-time

    AssetRisk:
      type: object
      required:
        - asset
        - quote
        - ledgerSeq
        - ledgerClosedAt
        - computedAt
        - methodologyVersion
        - dataSource
        - priceSource
        - spreadPct
        - depth
        - manipulationCost
        - maxReachablePrice
        - flags
        - band
        - warnings
      properties:
        asset: { $ref: '#/components/schemas/Asset' }
        quote:
          allOf: [$ref: '#/components/schemas/Asset']
          description: Satuan seluruh nilai notional pada respons ini
        ledgerSeq:
          type: integer
          format: int64
        ledgerClosedAt:
          type: string
          format: date-time
        computedAt:
          type: string
          format: date-time
        methodologyVersion:
          type: string
        dataSource: { $ref: '#/components/schemas/DataSource' }
        midPrice:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
          description: |
            Null kalau priceSource bernilai none. Perhatikan bahwa midPrice yang
            terisi belum tentu bermakna: kalau `SPREAD_EXTREME` menyala, angka ini
            adalah titik tengah dari dua harga yang tidak berhubungan satu sama lain.
        priceSource:
          type: string
          enum: [book, pool, none]
          description: |
            `book` berarti dari mid orderbook, `pool` berarti dari harga spot pool
            karena orderbook kosong atau satu sisi, `none` berarti aset tidak
            punya harga eksekutabel sama sekali. Nilai `none` bukan error.
        spreadPct:
          oneOf: [$ref: '#/components/schemas/Decimal', type: 'null']
          description: |
            Selisih best ask dan best bid dibagi `midPrice`, dinyatakan dalam
            PERSEN mengikuti konvensi seluruh field berakhiran `Pct` pada API ini.
            Nilai '196.0777141' berarti spread 196 persen.

            Null kalau salah satu sisi buku kosong atau `priceSource` bukan `book`,
            karena spread tidak terdefinisi tanpa dua sisi buku.

            Nilai di atas `spreadExtremePct` memicu `SPREAD_EXTREME`. Di atas
            ambang itu `midPrice` dan seluruh metrik yang diturunkan darinya,
            termasuk tangga depth 2/5/10 persen, kehilangan makna.
        depth:
          type: array
          items: { $ref: '#/components/schemas/DepthPoint' }
          minItems: 3
          maxItems: 3
        manipulationCost:
          type: array
          description: |
            Tangga 0.5, 1, 10, 100 dalam urutan delta menaik. Array kosong kalau
            tidak ada harga eksekutabel.
          items: { $ref: '#/components/schemas/ManipulationCost' }
          maxItems: 4
        maxReachablePrice:
          oneOf: [$ref: '#/components/schemas/Decimal', type: 'null']
          description: |
            Harga tertinggi yang masih dapat dicapai dengan menyerap seluruh ask
            yang tersedia. Ini batas atas nyata pergerakan harga lewat orderbook.

            Setiap entri `manipulationCost` yang `targetPrice`-nya berada di atas
            nilai ini pasti bernilai `reachable: false`.

            Null dalam dua keadaan: tidak ada ask sama sekali pada pasangan ini,
            atau seluruh likuiditas berasal dari AMM. Kurva constant product tidak
            punya batas atas harga, sehingga tidak ada nilai maksimum yang dapat
            dilaporkan.
        oracleResistance:
          oneOf: [$ref: '#/components/schemas/OracleResistance', type: 'null']
          description: |
            Null kalau tidak ada harga eksekutabel, karena tidak ada harga yang
            bisa digeser.
        maxSafeCollateral:
          oneOf:
