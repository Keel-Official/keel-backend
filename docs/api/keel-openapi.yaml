    AssetBrokenBook:
      summary: >-
        assetBrokenBook. Buku dengan spread 196 persen. HTTP 200, bukan error,
        dan bukan kondisi normal. Butuh tampilan tersendiri.
      description: |
        Keadaan ketiga yang harus dibedakan frontend, di samping aset sehat dan
        aset tanpa harga.

        USTRY/USDC sesaat sebelum ledger 61340263, keadaan nyata di ledger, bukan
        angka karangan. Bukunya berisi tepat satu ask pada 106.7372828 dan tepat
        satu bid pada 1.0570000. Titik tengahnya 53.8971414 untuk aset yang
        sebenarnya bernilai sekitar 1.06.

        Yang harus dilakukan tampilan pada keadaan ini:

        1. Jangan tampilkan `midPrice` sebagai harga. Ia titik tengah dari dua
           harga yang tidak berhubungan. Kalau tetap ditampilkan, beri penanda
           bahwa angkanya tidak bermakna.
        2. Turunkan atau redam tangga depth 2/5/10 persen. Ketiganya diturunkan
           dari `midPrice` yang sudah tidak bermakna, dan tetap dilaporkan hanya
           karena dijanjikan di SOW, bukan karena berguna di sini.
        3. Naikkan tangga `manipulationCost` delta 10 dan 100 beserta
           `maxReachablePrice`. Pada buku serusak ini, tangga besar dan
           `SPREAD_EXTREME` yang membawa informasi, bukan tangga wajib.
        4. Bedakan `cost: '0'` dengan `reachable: false` dari `cost: '0'` dengan
           `reachable: true`. Lihat butir 7 pada deskripsi API.

        Seluruh angka pada contoh ini SUDAH TERISI dari golden fixture di
        testdata/fixtures/ustry_pre_exploit.md, yang dihitung dengan tangan
        sebelum implementasi ada. Penanda `TODO-FIXTURE` dan `reachable: null`
        tidak ada lagi.

        SATU KOREKSI TERHADAP VERSI SEBELUMNYA. Entri delta 1.0 sebelumnya
        tertulis `reachable: true`. Itu SALAH dan merupakan persis kesalahan
        yang butir 7 pada deskripsi API peringatkan. Ask termahal di buku
        berharga 106.7372828, di bawah target 107.7942828, sehingga tidak ada
        ask yang memenuhi `>= target` dan `reachable` bernilai false. Nilai
        `cost: '130.0627093'` pada baris itu TIDAK menyatakan biaya mencapai
        sasaran, sebab sasarannya tidak dapat dicapai sama sekali.

        Bentuk field, nama field, dan tipenya sudah final dan aman dipakai
        frontend untuk mulai membangun.
      value:
        asset:
          code: USTRY
          type: credit_alphanum12
