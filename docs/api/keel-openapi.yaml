            Rentang ledger di dalam permintaan yang datanya tidak tersedia.
            Dashboard wajib menampilkan celah ini, bukan menginterpolasinya.
          items:
            type: object
            required: [from, to, reason]
            properties:
              from: { type: integer, format: int64 }
              to: { type: integer, format: int64 }
              reason: { type: string }
        points:
          type: array
          items: { $ref: '#/components/schemas/HistoryPoint' }

