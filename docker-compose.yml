services:
  postgres:
    image: postgres:16-alpine
    container_name: keel-postgres
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel_dev_only
      POSTGRES_DB: keel
    ports:
      # 5433 ON THE HOST, 5432 INSIDE THE CONTAINER. It was 5432:5432 until 26
      # August 2026, and a Postgres already installed on the host takes that port
      # first: the host server binds 127.0.0.1 specifically while Docker binds the
      # wildcard, so `localhost` reaches the host server and the symptom is
      # `role "keel" does not exist` rather than a refused connection.
      #
      # `make migrate` never noticed, because scripts/migrate.sh goes through
      # `docker compose exec` and never touches a published port at all. The
      # schema could therefore be applied to THIS container while every Go client
      # talked to a different server entirely, which is what happened on 26 August
      # 2026: migrate reported four files present and the store suite failed on
      # all 31 tests with a missing role.
      #
      # The container port stays 5432. Nothing inside the container moves, so the
      # healthcheck and `docker compose exec postgres psql` are unchanged.
      - "5433:5432"
    volumes:
      - keel_pgdata:/var/lib/postgresql/data
      # migrations/ is deliberately NOT mounted into
      # /docker-entrypoint-initdb.d. Postgres runs that directory only when the
      # data directory is empty, so it applies the first file on a fresh volume
      # and silently ignores every file after it. Migrations go through
      # `make migrate` instead, which is the only mechanism.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- the API
  #
  # UNDER A PROFILE, SO `make up` DOES NOT CHANGE. That target is what a developer
  # runs to get a database, and it has meant "Postgres on 5433" since this file
  # existed. A service that started with it would change what one command does to
  # every existing workflow, including the store suite. Start this one with:
  #
  #   docker compose --profile app up -d
  #
  # THE DSN INSIDE THE NETWORK IS PORT 5432 AND NOT 5433, and the long comment on
  # the postgres ports above is why that distinction has already cost this
  # repository a day. 5433 is the HOST side of the published port. A container on
  # this network reaches Postgres at its container port, and using 5433 here fails
  # as a refused connection rather than as anything informative.
  keel:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: keel:local
    container_name: keel-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEEL_DSN: "postgres://keel:keel_dev_only@postgres:5432/keel?sslmode=disable"
    command: ["serve", "-addr", ":3000"]
    ports:
      - "3000:3000"
    restart: unless-stopped
    # THE SCHEMA IS NOT APPLIED BY THIS SERVICE. `make migrate` is the only
    # mechanism, for the reason scripts/migrate.sh states in its own header: a
    # migration that runs from two places is a migration nobody can say ran. Bring
    # Postgres up, run `make migrate`, then start this.
    #
    # No healthcheck. This image has no shell and no curl by design, so the usual
    # CMD-SHELL form cannot run in it, and adding a binary purely to test the
    # process from inside would widen the image for a check the compose file can
    # get from outside. GET /v1/health is the endpoint.
  
  keel-scan:
    profiles: ["app"]
    image: ghcr.io/keel-official/keel-backend:${IMAGE_TAG:-main}    # image yang sama dengan `keel`, dibangun sekali
    container_name: keel-scan
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # PERSIS SAMA dengan DSN service `keel`: port 5432 (port DALAM container),
      # BUKAN 5433. 5433 hanya sisi HOST — dipakai di sini akan connection refused.
      KEEL_DSN: "postgres://keel:keel_dev_only@postgres:5432/keel?sslmode=disable"
    command: ["scan", "-interval", "15m"]
    restart: unless-stopped
    # Tidak ada port yang di-publish (scan tidak melayani HTTP) dan tidak ada
    # healthcheck (image distroless, tanpa shell) — sama alasannya dengan `keel`.


volumes:
  keel_pgdata:
