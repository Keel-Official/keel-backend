services:
  postgres:
    image: postgres:16-alpine
    container_name: keel-postgres
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel_dev_only
      POSTGRES_DB: keel
    ports:
      - "5432:5432"
    volumes:
      - keel_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  keel_pgdata:
